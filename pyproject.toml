[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alakazam-gym"
version = "0.1.0"
description = "Train policies inside Alakazam world models: local dream env (public weights), hosted simulation gym, and frozen-oracle certification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alakazam" }]
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
camera = ["Pillow>=10"]

[tool.setuptools]
packages = ["alakazam_gym"]

[tool.setuptools.package-data]
alakazam_gym = ["data/*.json"]
